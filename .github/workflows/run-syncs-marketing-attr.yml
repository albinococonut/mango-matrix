name: Warm Marketing Attribution

# Attributes new customers to marketing channel by matching WhatConverts call
# history to Tekmetric repair orders via phone number lookup.
# Runs per-shop in parallel to stay well within Vercel's per-function timeout.
# Must run AFTER warm-marketing-new-customers has populated its cache.

on:
  schedule:
    # 7:00 AM UTC = midnight MT — 1 hour after warm-marketing-new-customers
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  warm-marketing-attr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Warm attribution — all shops in parallel
        env:
          SYNC_CRON_URL: ${{ secrets.SYNC_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          FAIL=0

          run_shop() {
            local SHOP=$1
            local HTTP_CODE
            HTTP_CODE=$(curl -sS -o "/tmp/attr_${SHOP}.out" -w "%{http_code}" \
              -X POST "${SYNC_CRON_URL}?job=warm-marketing-attribution&shop=${SHOP}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --max-time 700)
            echo "shop ${SHOP}: HTTP ${HTTP_CODE} — $(cat /tmp/attr_${SHOP}.out)"
            if [ "$HTTP_CODE" -ge 500 ] || [ "$HTTP_CODE" = "401" ]; then
              echo "::warning::shop ${SHOP} returned HTTP ${HTTP_CODE}"
              return 1
            fi
          }

          # Launch all shops in parallel
          pids=()
          for shop in 001 002 003 004 005 006 007 009; do
            run_shop "$shop" &
            pids+=($!)
          done

          # Wait for all; track any failures
          for pid in "${pids[@]}"; do
            wait "$pid" || FAIL=1
          done

          if [ $FAIL -eq 1 ]; then
            echo "::warning::one or more shop attribution jobs failed — proceeding to aggregate with available data"
          fi

      - name: Aggregate attribution cache
        env:
          SYNC_CRON_URL: ${{ secrets.SYNC_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          HTTP_CODE=$(curl -sS -o /tmp/attr_aggregate.out -w "%{http_code}" \
            -X POST "${SYNC_CRON_URL}?job=warm-marketing-attribution&shop=aggregate" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 60)
          echo "aggregate: HTTP ${HTTP_CODE}"
          cat /tmp/attr_aggregate.out
          echo
          if [ "$HTTP_CODE" -ge 500 ] || [ "$HTTP_CODE" = "401" ]; then
            echo "::error::aggregate step returned HTTP ${HTTP_CODE}"
            exit 1
          fi
