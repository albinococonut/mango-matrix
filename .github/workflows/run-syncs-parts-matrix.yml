name: Run Mango Dashboard Syncs (Parts Matrix)

# Pre-warms the parts-matrix-usage cache for the default date range (last 7 days,
# mode=all) so the Parts Pricing page loads instantly instead of waiting 15-30s
# for Tekmetric to respond across all 8 shops on every cold hit.
#
# Runs every 30 minutes — more frequent than the 2-hour TTL so there's always a
# warm cache ready. Offset by 12 min from the main sweep so the two never hit
# Tekmetric at the same time.

on:
  schedule:
    # 12,42 past each hour — offset from main sweep (0,15,30,45) and the
    # heavy jobs (2,7,17,22,32,37,47,52) so Tekmetric capacity is staggered.
    - cron: "12,42 * * * *"
  workflow_dispatch:

jobs:
  warm-parts-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Trigger parts-matrix warm
        env:
          SYNC_CRON_URL: ${{ secrets.SYNC_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Not `set -e` here: with `X=$(curl ...)`, errexit treats a nonzero curl
          # exit (e.g. exit 28 on --max-time timeout) as the whole assignment
          # failing and kills the script before the HTTP_CODE checks below ever
          # run — that's what turned every slow-but-not-actually-broken Tekmetric
          # cycle into a hard job failure and an email to Jessica.
          set +e
          HTTP_CODE=$(curl -sS -o /tmp/sync.out -w "%{http_code}" \
            -X POST "${SYNC_CRON_URL}?job=warm-parts-matrix" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 750)
          CURL_EXIT=$?
          echo "curl exit $CURL_EXIT, HTTP $HTTP_CODE"
          cat /tmp/sync.out 2>/dev/null
          echo

          # Transport-level failure (timeout, DNS, connection reset — no HTTP
          # response at all). Warn but don't fail the job: the endpoint has its
          # own internal deadline and retries every 30 min, so a single slow
          # Tekmetric cycle self-heals before the 2h cache TTL expires.
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Parts-matrix warm request failed at the transport level (curl exit $CURL_EXIT), not a code error — not failing the job"
            exit 0
          fi
          # CRON_SECRET misconfigured — this needs a human, fail loudly.
          if [ "$HTTP_CODE" = "401" ]; then
            echo "::error::Parts-matrix warm endpoint returned HTTP 401 — CRON_SECRET misconfigured"
            exit 1
          fi
          # Any other server error: log it but don't hard-fail the job.
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "::warning::Parts-matrix warm endpoint returned HTTP $HTTP_CODE"
            exit 0
          fi
