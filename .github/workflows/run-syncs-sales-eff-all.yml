name: Re-grade All Shops (Sales Effectiveness)

# One-shot workflow to re-grade all 8 shops immediately.
# Trigger manually via workflow_dispatch when a rubric change requires
# all shops to be re-graded before the normal 4-hour round-robin cycle.
# Each shop takes 4–12 min; all 8 run sequentially in a single job.

on:
  workflow_dispatch:

jobs:
  regrade-all:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Re-grade all shops (8 sequential passes)
        env:
          SYNC_CRON_URL: ${{ secrets.SYNC_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== Shop pass $i/8 ==="
            HTTP_CODE=$(curl -sS -o /tmp/sync.out -w "%{http_code}" \
              -X POST "${SYNC_CRON_URL}?job=warm-sales-effectiveness" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --max-time 750)
            echo "HTTP $HTTP_CODE"
            cat /tmp/sync.out
            echo
            if [ "$HTTP_CODE" = "401" ]; then
              echo "::error::Unauthorized — check CRON_SECRET"
              exit 1
            fi
            if [ "$HTTP_CODE" -ge 500 ]; then
              echo "::warning::Pass $i returned HTTP $HTTP_CODE — continuing to next shop"
            fi
            # Brief pause between shops to avoid hitting RC rate limits
            if [ "$i" -lt 8 ]; then sleep 15; fi
          done
          echo "=== All 8 shops processed ==="
