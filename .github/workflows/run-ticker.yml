name: Daily Ticker Generator

# Runs every day at 6 AM US Eastern (EDT = UTC-4 → 10:00 UTC).
# Calls the server-side ticker generator which uses Claude Haiku + Matrix data
# to produce one fresh line for the intranet ticker.

on:
  schedule:
    - cron: "3 10 * * *"   # 10:03 UTC = ~6:03 AM EDT (UTC-4 summer)
  workflow_dispatch:        # manual trigger for testing / catch-up

jobs:
  generate-ticker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate daily ticker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          HTTP_CODE=$(curl -sS -o /tmp/ticker.out -w "%{http_code}" \
            -X POST "https://matrix.mangoautomotive.com/api/cron/ticker" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 90)
          echo "Response (HTTP $HTTP_CODE):"
          cat /tmp/ticker.out
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Ticker generated successfully."
